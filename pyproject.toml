[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kkunal"
dynamic = ["version"]
description = "Kkunal - Python library for the Choice FinX Trading API with built-in technical indicators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kkunal" }]
requires-python = ">=3.9"   # setuptools 76+, which PEP 639 licence metadata needs, dropped 3.8
keywords = ["choice", "finx", "trading", "nse", "bse", "mcx", "broker-api", "technical-indicators", "algo-trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
    "websockets>=11.0.3",
    "websocket-client>=1.6.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = ["build", "twine", "ruff", "mypy", "pandas-stubs", "types-requests"]

[project.urls]
Homepage = "https://github.com/SomeshD24/Kkunal"
Issues = "https://github.com/SomeshD24/Kkunal/issues"
Changelog = "https://github.com/SomeshD24/Kkunal/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["choice_api"]

[tool.setuptools.dynamic]
# Single source of truth: choice_api/__init__.py
version = { attr = "choice_api.__version__" }

[tool.setuptools.package-data]
choice_api = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, pylint errors
select = ["F", "E9", "B", "PLE"]
ignore = ["B905"]           # zip(strict=) needs Python 3.10

[tool.mypy]
ignore_missing_imports = true
files = ["choice_api"]
